slam_toolbox:
  ros__parameters:
    use_sim_time: false
    slam_mode: true
    resolution: 0.05
    max_laser_range: 12.0
    minimum_time_interval: 0.5
    transform_publish_period: 0.05
    map_update_interval: 1.0
    map_frame: map
    odom_frame: odom
    base_frame: base_link
    scan_topic: scan
    mode: mapping
    enable_interactive_mode: false
