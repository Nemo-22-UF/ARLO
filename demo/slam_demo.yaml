slam_toolbox:
  ros__parameters:
    mode: mapping
    odom_frame: odom
    map_frame: map
    base_frame: base_link
    scan_topic: /scan
    max_laser_range: 12.0
    minimum_travel_distance: 0.1
    minimum_travel_heading: 0.1
    map_update_interval: 2.0
    resolution: 0.05
    use_sim_time: false
    transform_timeout: 0.8
    tf_buffer_duration: 30.0
